name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Windows Executable
        run: |
          go build -ldflags="-s -w -H windowsgui" -o AmongUsCapture-v2.exe ./cmd/aucapture

      - name: Create Distribution ZIP
        run: |
          Compress-Archive -Path AmongUsCapture-v2.exe, README.md, LICENSE -DestinationPath AmongUsCapture-v2-windows-amd64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            AmongUsCapture-v2.exe
            AmongUsCapture-v2-windows-amd64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
